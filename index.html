<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeon Crawl - Dark Fantasy RPG</title>
  
  <!-- FontAwesome Icons & Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="Game design.css">
</head>

<body>
  <!-- Ambient Particle Canvas Overlay -->
  <canvas id="fx-canvas"></canvas>

  <div class="game-container">
    <!-- Top Navigation Header -->
    <header class="game-header panel" style="padding:10px 16px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div class="brand" style="display:flex; align-items:center; gap:8px;">
        <div class="crest" style="width:30px; height:30px; border-radius:8px; background:linear-gradient(160deg,var(--gold-bright),var(--ember)); display:flex; align-items:center; justify-content:center; font-size:16px;">
          <i class="fas fa-dragon" style="color:#000; font-size:14px;"></i>
        </div>
        <h1 style="font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--ink); margin:0;">Dungeon Crawl</h1>
      </div>

      <div class="header-stats" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <div class="pill stage-badge" style="color:var(--gold);">Stage <span id="hdr-stage">1</span></div>
        <div class="pill gold-c"><img src="characters imgs/items/ruby_gem.jpg" style="width:14px; height:14px; border-radius:50%; object-fit:cover;"> <span id="hdr-gold">0</span> Gold</div>
        <div class="pill coin-c" onclick="GameManager.openInventoryModal('gear')" style="cursor:pointer;"><img src="characters imgs/items/diamond_gem.jpg" style="width:14px; height:14px; border-radius:50%; object-fit:cover;"> <span id="hdr-coins">0</span> Coins</div>
        <button class="icon-btn" onclick="GameManager.openInventoryModal()" style="padding:6px 12px;">Inventory</button>
        <button class="icon-btn" onclick="GameManager.openSettingsModal()" style="padding:6px 12px;">Settings</button>
        <button class="icon-btn" onclick="TutorialEngine.openTutorial(0)" style="padding:6px 12px;">Guide</button>
      </div>
    </header>

    <!-- Dynamic Main View (Character Selection / Battle Arena) -->
    <main id="main-view" class="glass-panel" style="min-height: 580px;"></main>
  </div>

  <!-- Dynamic Modals Container (Shop, Inventory, Stat Point Allocation, Victory/Defeat) -->
  <div id="modal-container"></div>

  <!-- JS Modules loaded at end of body -->
  <script src="Scripts/SoundEngine.js"></script>
  <script src="Scripts/ParticleEngine.js"></script>
  <script src="Scripts/DialogueEngine.js"></script>
  <script src="Scripts/TutorialEngine.js"></script>
  <script src="Scripts/CloudDatabase.js"></script>
  <script src="Scripts/player.js"></script>
  <script src="Scripts/enemy.js"></script>
  <script src="Scripts/ProceduralEngine.js"></script>
  <script src="Scripts/GameManager.js"></script>
</body>

</html>
